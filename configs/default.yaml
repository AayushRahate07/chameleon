# ============================================================
# KV-Cache Eviction Project Configuration
# ============================================================

model:
  name: "Qwen/Qwen2.5-0.5B"
  dtype: float32
  attn_implementation: eager

experiment:
  T: 512                          # tokens per sequence
  seed: 0

  # Attention-retained experiment
  budgets: [0.1, 0.2, 0.3, 0.5]
  n_seq: 3                        # sequences per text type

  # Real-decoding perplexity
  ppl_budgets: [0.1, 0.25]

  # Needle-in-a-haystack
  needle_depths: [0.1, 0.3, 0.5, 0.7, 0.9]
  needle_budget: 0.2

# Scaled experiment presets (section 10c+)
presets:
  quick:
    n_seq: 4
    n_ppl: 1
    n_reps: 1
  full:
    n_seq: 12
    n_ppl: 4
    n_reps: 3

# Gauntlet settings
gauntlet:
  train_budgets: [0.1, 0.2, 0.3, 0.5]
  test_budgets: [0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5]
  run_long: false                 # 2T-length generalisation test

# Chameleon hyperparameters (from theory, not tuned on test data)
chameleon:
  eta_scale: 1.0                  # eta = eta_scale * sqrt(8 ln N / T)
  share: 5.0                      # fixed-share rate alpha = share / T
  sinks: 4                        # attention sink tokens protected
  grace: 0.0625                   # 1/16; newest grace*k tokens protected
  q_frac: 0.25                    # loss evaluated on bottom q_frac*k tokens
