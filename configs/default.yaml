# ============================================================
# Chameleon KV-Cache Eviction Benchmark Configuration
# Matches PRESETS in notebooks/kv_bench.ipynb
# ============================================================

model:
  name: "Qwen/Qwen2.5-0.5B"
  dtype: float32
  attn_implementation: eager

domains:
  all_types: ["wikipedia", "code", "dialogue", "books", "science", "math"]
  sinks_for_gap_breakdown: 4

fairness:
  tune_budget: 8                   # max settings per policy, tuned strictly on DEV
  verdict_min_gain: 0.0025         # CI lower bound threshold for a clear win

presets:
  quick:
    T: 256
    text_types: ["wikipedia", "code", "dialogue"]
    n_seq: 4
    train_budgets: [0.1, 0.2, 0.3]
    test_budgets: [0.1, 0.15, 0.2, 0.3]
    n_splice: 1
    ppl_seqs: 1
    ppl_shift_seqs: 1
    ppl_budgets: [0.15]
    needle_depths: [0.1, 0.5, 0.9]
    needle_reps: 2
    needle_budgets: [0.2, 0.5]
    stress_T: 256
    stress_seeds: [0]
    adv_T: 48
    adv_k: 8
    adv_iters: 30
    adv_restarts: 1
    dagger_rounds: 1

  full:
    T: 512
    text_types: ["wikipedia", "code", "dialogue", "books", "science", "math"]
    n_seq: 24
    train_budgets: [0.1, 0.2, 0.3, 0.5]
    test_budgets: [0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5]
    n_splice: 4
    ppl_seqs: 8
    ppl_shift_seqs: 2
    ppl_budgets: [0.1, 0.15, 0.3]
    needle_depths: [0.1, 0.3, 0.5, 0.7, 0.9]
    needle_reps: 8
    needle_budgets: [0.1, 0.2, 0.3, 0.5]
    stress_T: 512
    stress_seeds: [0, 1, 2]
    stress_budgets: [0.1, 0.2, 0.3]
    adv_T: 64
    adv_k: 16
    adv_iters: 150
    adv_restarts: 3
    dagger_rounds: 3

  long:
    T: 2048
    text_types: ["wikipedia", "code", "dialogue", "books", "science", "math"]
    n_seq: 12
    train_budgets: [0.1, 0.2, 0.3]
    test_budgets: [0.05, 0.1, 0.2, 0.3]
    n_splice: 2
    ppl_seqs: 3
    ppl_shift_seqs: 1
    ppl_budgets: [0.1, 0.2]
    needle_reps: 4
    needle_budgets: [0.1, 0.2, 0.3]
